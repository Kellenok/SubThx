name: Release

# push a tag like v0.1.0 to build the Windows zip and publish it as a GitHub release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the app's npm dependencies
        working-directory: app
        run: npm ci

      - name: Build the release zip
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/subthx-*-windows-x64.zip
          generate_release_notes: true
