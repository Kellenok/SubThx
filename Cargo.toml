[package]
name = "subthx"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"
unicode-general-category = "1"
memchr = "2.8.3"
rayon = "1.12.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
html-escape = "0.3.0"
percent-encoding = "2.3.2"
clap = { version = "4.6.7", features = ["derive"] }
realfft = "3.5.0"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "half", "download-binaries", "copy-dylibs", "directml", "cuda", "tls-native"] }
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "all-codecs", "all-formats"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "fs", "signal", "io-util"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.28.0", features = ["v4"] }
half = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

[profile.release]
debug = 1

[profile.test]
opt-level = 3

[workspace]
members = ["app/src-tauri"]
